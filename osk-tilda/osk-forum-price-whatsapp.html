<!-- OSK Forum: автоматическая цена билета по датам + кнопки «Купить» сразу в WhatsApp. -->
<!-- Вставляется ВМЕСТО содержимого существующего HTML-блока (T123) на странице osk.kg/ticket. -->
<script>
(function () {
  var PHONE = '996502510770';
  var FULL_PRICE = 6000;
  // Каждая цена действует до 23:59 указанного дня по времени Бишкека (UTC+6).
  var TIERS = [
    { until: '2026-10-19', price: 3000, label: '19 октября', short: '19.10' },
    { until: '2026-11-02', price: 4000, label: '2 ноября', short: '2.11' },
    { until: '2026-11-16', price: 5000, label: '16 ноября', short: '16.11' },
    { until: '2026-11-21', price: 6000, label: '21 ноября', short: '21.11' }
  ];

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  function currentTier() {
    var now = Date.now();
    for (var i = 0; i < TIERS.length; i++) {
      if (now <= Date.parse(TIERS[i].until + 'T23:59:59+06:00')) return i;
    }
    return TIERS.length - 1;
  }

  var i = currentTier();
  var t = TIERS[i];
  var next = TIERS[i + 1];
  var price = fmt(t.price) + ' сом';
  var discount = Math.round((1 - t.price / FULL_PRICE) * 100);
  var hasDiscount = discount > 0;

  // Блок «Билет участника» (Zero Block rec4634694403): элементы там стоят по жёстким
  // координатам и на разных экранах наезжают друг на друга. Прячем его и рисуем ту же
  // информацию обычной вёрсткой: цена, скидка, срок, кнопка сразу под ценой, шаги покупки.
  var TICKET_REC = 'rec4634694403';
  var TICKET_CSS =
    '.osk-tk{background:#07101f;color:#fff;font-family:Gilroy,Inter,Arial,sans-serif;padding:48px 20px 56px;-webkit-font-smoothing:antialiased}' +
    '.osk-tk *{box-sizing:border-box}' +
    '.osk-tk__in{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px}' +
    '.osk-tk__eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4b8dff;margin:0 0 14px}' +
    '.osk-tk__card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px}' +
    '.osk-tk__row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}' +
    '.osk-tk__price{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.01em;white-space:nowrap}' +
    '.osk-tk__badge{font-size:15px;font-weight:700;line-height:1;padding:7px 10px;border-radius:999px;background:#ff3b30;color:#fff;white-space:nowrap}' +
    '.osk-tk__old{font-size:16px;font-weight:600;color:rgba(255,255,255,.55);text-decoration:line-through;white-space:nowrap}' +
    '.osk-tk__row+.osk-tk__price{margin-top:12px}' +
    '.osk-tk__until{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.08);font-size:15px;font-weight:600;line-height:1.35}' +
    '.osk-tk__btn{margin-top:18px;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 16px;border-radius:14px;' +
      'background:#0068ff;color:#fff!important;font-size:17px;font-weight:700;line-height:1.2;text-align:center;text-decoration:none!important;' +
      'box-shadow:0 10px 24px rgba(0,104,255,.35);transition:transform .1s,background .2s}' +
    '.osk-tk__btn:hover{background:#0a5ce0}.osk-tk__btn:active{transform:scale(.98)}' +
    '.osk-tk__hint{margin-top:10px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);text-align:center}' +
    '.osk-tk__steps{background:#fff;color:#111318;border-radius:20px;padding:24px}' +
    '.osk-tk__steps h3{margin:0 0 16px;font-family:inherit;font-size:22px;font-weight:700;line-height:1.2;color:#111318}' +
    '.osk-tk__steps ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}' +
    '.osk-tk__steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:15px;font-weight:600;line-height:1.4;color:#303642}' +
    '.osk-tk__n{width:28px;height:28px;border-radius:50%;background:#eaf1ff;color:#0068ff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}' +
    '@media (min-width:960px){.osk-tk{padding:96px 40px}.osk-tk__in{grid-template-columns:1fr 1fr;gap:32px;align-items:start}' +
      '.osk-tk__card,.osk-tk__steps{padding:32px}.osk-tk__price{font-size:56px}.osk-tk__steps{margin-top:30px}}';

  function ticketSectionHTML() {
    var steps = [
      'Нажмите «Купить билет» и отправьте готовое сообщение в WhatsApp.',
      'В ответ пришлём QR для оплаты и короткую инструкцию.',
      'Оплатите ' + price + ' и отправьте чек по ссылке из сообщения.',
      'После проверки билет с QR-кодом придёт в WhatsApp. Покажите его на входе.'
    ];
    return '<div class="osk-tk__in">' +
      '<div><div class="osk-tk__eyebrow">Билет участника</div>' +
        '<div class="osk-tk__card">' +
          (hasDiscount ? '<div class="osk-tk__row"><span class="osk-tk__badge">−' + discount + '%</span>' +
            '<span class="osk-tk__old">' + fmt(FULL_PRICE) + ' сом</span></div>' : '') +
          '<div class="osk-tk__price">' + price + '</div>' +
          '<div class="osk-tk__until">' + (next ? 'Цена действует до ' + t.label + ', 23:59. Потом — ' + fmt(next.price) + ' сом'
            : 'Цена действует до ' + t.label) + '</div>' +
          '<a class="osk-tk__btn" data-osk-buy="1" href="' + waHref + '">Купить билет за ' + price + '</a>' +
          '<div class="osk-tk__hint">Откроется WhatsApp с готовым сообщением</div>' +
        '</div></div>' +
      '<div class="osk-tk__steps"><h3>Как купить билет</h3><ol>' +
        steps.map(function (s, n) { return '<li><span class="osk-tk__n">' + (n + 1) + '</span><span>' + s + '</span></li>'; }).join('') +
      '</ol></div>' +
    '</div>';
  }

  function renderTicketSection() {
    var rec = document.getElementById(TICKET_REC);
    if (!rec || rec.querySelector('.osk-tk')) return;
    if (!document.getElementById('osk-tk-css')) {
      var st = document.createElement('style');
      st.id = 'osk-tk-css';
      st.textContent = TICKET_CSS + '#' + TICKET_REC + ' .t396{display:none!important}';
      document.head.appendChild(st);
    }
    var section = document.createElement('div');
    section.className = 'osk-tk';
    section.innerHTML = ticketSectionHTML();
    rec.appendChild(section);
  }

  // Текст, который ПОКУПАТЕЛЬ отправляет нам. Инструкцию с QR отвечает менеджер с номера PHONE.
  var message =
    'Здравствуйте! Хочу купить билет на OSK Forum 2026 (21 ноября, Бишкек).\n' +
    'Цена сейчас: ' + price + ' (до ' + t.label + ').\n' +
    'Количество билетов: 1';

  var waHref = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(message);

  // Кнопка покупки: попап формы, любая ссылка WhatsApp или «Купить…» с якорем.
  function isBuyLink(a) {
    if (!a || a.tagName !== 'A') return false;
    var href = a.getAttribute('href') || '';
    if (href === '#popup:payment') return true;
    if (/wa\.me|api\.whatsapp\.com/.test(href)) return true;
    return href.charAt(0) === '#' && /купить|сатып ал/i.test(a.textContent || '');
  }

  function track() {
    try { if (window.gtag) window.gtag('event', 'ticket_intent', { method: 'whatsapp', value: t.price, currency: 'KGS' }); } catch (e) {}
    try { if (window.fbq) window.fbq('track', 'InitiateCheckout', { value: t.price, currency: 'KGS' }); } catch (e) {}
    try { if (window.dataLayer) window.dataLayer.push({ event: 'ticket_whatsapp_click', value: t.price }); } catch (e) {}
  }

  // Ловим нажатие раньше Тильды, чтобы попап с формой не открывался.
  window.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!isBuyLink(a)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    track();
    setTimeout(function () { window.location.href = waHref; }, 150);
  }, true);

  function setHTML(sel, html) {
    var els = document.querySelectorAll(sel);
    for (var k = 0; k < els.length; k++) els[k].innerHTML = html;
  }

  function apply() {
    // Все кнопки покупки ведут прямо в WhatsApp (видно и при долгом нажатии / копировании ссылки)
    var links = document.querySelectorAll('a');
    for (var k = 0; k < links.length; k++) {
      if (!isBuyLink(links[k])) continue;
      links[k].href = waHref;
      links[k].removeAttribute('target');
      links[k].rel = 'noopener';
    }
    // Если попап формы всё же откроется — после отправки тоже наш номер и новый текст
    var forms = document.querySelectorAll('form[data-success-url*="wa.me"]');
    for (var f = 0; f < forms.length; f++) forms[f].setAttribute('data-success-url', waHref);

    // Первый экран: карточка «Билет»
    var spans = document.querySelectorAll('#rec4634692503 span');
    for (var s = 0; s < spans.length; s++) {
      var tx = spans[s].textContent;
      if (/^Скидка \d+%$/.test(tx)) spans[s].textContent = hasDiscount ? 'Скидка ' + discount + '%' : '';
      if (/^Сейчас к оплате:/.test(tx)) spans[s].textContent = 'Сейчас к оплате: ' + price;
      if (/^\s*сейчас\s*$/.test(tx) && !hasDiscount) spans[s].textContent = '';
    }

    // Блок «Билет участника» — своя вёрстка вместо Zero Block
    renderTicketSection();

    // FAQ «Есть ли VIP-билеты?»
    setHTML('[field="tn_text_1791545612000000011"]',
      '<b>Есть ли VIP-билеты?</b><br><span style="color:#626a76;font-weight:500">' +
      'Нет. Формат один для всех гостей. Сейчас билет стоит ' + price + ' (до ' + t.label + '), ' +
      'полная цена — ' + fmt(FULL_PRICE) + ' сом.</span>');
  }

  // Переключатель RU/KG в шапке: «RU» на синем кружке, «KG» серым рядом
  function fixLangSwitch() {
    var atom = document.querySelector('[data-elem-id="1791545600000000010"] .tn-atom');
    if (!atom || atom.getAttribute('data-osk-fixed')) return;
    atom.setAttribute('data-osk-fixed', '1');
    atom.style.whiteSpace = 'nowrap';
    atom.innerHTML =
      '<span style="display:inline-block;width:50px;margin-left:-13px;text-align:center;color:#fff">RU</span>' +
      '<span style="display:inline-block;width:54px;text-align:center;color:#8a93a3">KG</span>';
  }

  // Экраны 960–1199px (ноутбуки, iPad горизонтально): у блоков нет своей раскладки,
  // поэтому масштабируем десктопную. Первый экран не трогаем — у него своя раскладка.
  function fitMidScreens() {
    if (!document.getElementById('osk-mid-css')) {
      var st = document.createElement('style');
      st.id = 'osk-mid-css';
      st.textContent = '.osk-mid .t396__elem{margin-left:var(--osk-shift,0px)}';
      document.head.appendChild(st);
    }
    var w = window.innerWidth;
    var on = w >= 960 && w < 1200;
    var z = w / 1240;
    // Тильда сдвигает сетку на (w - 960) / 2 — компенсируем, чтобы контент стоял по центру
    var shift = ((w - 1160 * z) / 2 - z * ((w - 960) / 2 + 20)) / z;
    var blocks = document.querySelectorAll('.t396');
    for (var k = 0; k < blocks.length; k++) {
      if (blocks[k].closest('#rec4634692503')) continue;
      blocks[k].style.zoom = on ? z.toFixed(4) : '';
      blocks[k].classList.toggle('osk-mid', on);
      blocks[k].style.setProperty('--osk-shift', on ? shift.toFixed(1) + 'px' : '0px');
    }
  }

  function run() { apply(); fixLangSwitch(); fitMidScreens(); }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
  // Zero Block может перерисоваться после загрузки — применяем ещё раз
  window.addEventListener('load', function () { setTimeout(run, 300); });
  window.addEventListener('resize', fitMidScreens);
})();
</script>
