name: layout-switcher

on:
  push:
    paths:
      - 'layout_switcher/**'
      - '.github/workflows/layout-switcher.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: layout_switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_switcher.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import keyboard backend
        run: python -c "import platform, switcher; platform.system() == 'Darwin' and __import__('macos'); print('ok')"
      - name: Mac self-test
        if: runner.os == 'macOS'
        run: python mac_selftest.py --enable-russian
